name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Generous: vitest.config.ts sets fileParallelism:false for the node project,
    # so the seven files that spawn a real `prisma migrate deploy` run serially.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # postinstall runs `prisma generate`; src/generated/prisma is gitignored,
      # so this must precede typecheck or tsc fails on missing generated types.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
